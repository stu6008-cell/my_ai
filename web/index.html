<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>미니 AI - 웹 버전</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f6f4;
    --panel: #ffffff;
    --ink: #1c1c1a;
    --muted: #6b6b66;
    --line: #dedcd6;
    --accent: #2f6f4e;
    --accent-soft: #e6f0ea;
    --user-bg: #2f6f4e;
    --user-ink: #ffffff;
    --bot-bg: #ffffff;
    --warn: #a04a2a;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17171a;
      --panel: #1f1f23;
      --ink: #e8e8e4;
      --muted: #97978f;
      --line: #33333a;
      --accent: #6fbf8f;
      --accent-soft: #23332a;
      --user-bg: #2f5f47;
      --user-ink: #f2fff8;
      --bot-bg: #26262b;
      --warn: #e0956f;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
          "Pretendard", "Malgun Gothic", system-ui, sans-serif;
    display: flex;
    justify-content: center;
  }
  #shell {
    width: 100%;
    max-width: 760px;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border-left: 1px solid var(--line);
    border-right: 1px solid var(--line);
  }

  header {
    padding: 14px 18px 12px;
    border-bottom: 1px solid var(--line);
    display: flex;
    flex-wrap: wrap;
    gap: 10px 14px;
    align-items: baseline;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
  header .sub { font-size: 12.5px; color: var(--muted); }
  #status {
    width: 100%;
    font-size: 12.5px;
    color: var(--muted);
    font-family: var(--mono);
  }
  #status b { color: var(--accent); font-weight: 600; }

  #toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 10px 18px;
    border-bottom: 1px solid var(--line);
  }
  button {
    font: inherit;
    font-size: 13px;
    padding: 5px 11px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
    border-radius: 999px;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.primary { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

  #log { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  .turn { display: flex; flex-direction: column; gap: 4px; max-width: 88%; }
  .turn.me { align-self: flex-end; align-items: flex-end; }
  .turn.bot { align-self: flex-start; }
  .who { font-size: 11.5px; color: var(--muted); padding: 0 4px; }
  .bubble {
    padding: 9px 13px;
    border-radius: 14px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    border: 1px solid var(--line);
    background: var(--bot-bg);
  }

  .bubble.system { background: transparent; border-style: dashed; color: var(--muted); font-size: 13.5px; }
  .bubble.mono { font-family: var(--mono); font-size: 12.5px; line-height: 1.55; overflow-x: auto; }
  .score { font-family: var(--mono); font-size: 11.5px; color: var(--muted); padding: 0 4px; }

  #composer { display: flex; gap: 8px; padding: 12px 18px 16px; border-top: 1px solid var(--line); }
  #entry {

  }

  #curtain {

    display: none;

    justify-content: center;

  }
  body.dragging #curtain { display: flex; }
</style>

<body>
<div id="curtain">여기에 놓으면 그 파일만 학습해</div>

<div id="shell">
  <header>
    <h1>미니 AI</h1>
    <span class="sub">외부 API 없음 · 오프라인 · source.txt 에 적은 것만 학습</span>
    <div id="status">원본 없음 — 파일을 열거나 창에 끌어다 놓아줘.</div>
  </header>

  <div id="toolbar">
    <button id="btn-open" class="primary">파일 열기</button>
    <button id="btn-reload">새로고침</button>
    <button id="btn-data">데이터</button>
    <button id="btn-stats">학습현황</button>
    <button id="btn-guide">작성법</button>
    <button id="btn-dream">상상</button>
    <button id="btn-score" aria-pressed="false">점수 표시</button>
    <button id="btn-clear">기억 지우기</button>
    <input id="picker" type="file" accept=".txt,.json,.md,text/plain,application/json" hidden>
  </div>

  <div id="log" aria-live="polite"></div>

  <form id="composer">
    <textarea id="entry" rows="1" placeholder="물어봐.  '/도움말' 로 명령어 보기" autocomplete="off"></textarea>
    <button id="send" type="submit" class="primary">보내기</button>
  </form>
</div>

<script>
"use strict";
/* ==========================================================================
   미니 AI - 웹 버전

   파이썬판(mini_ai/)과 같은 알고리즘을 그대로 옮긴 것이다. 모듈 경계도
   같은 순서로 두어서 두 구현을 나란히 놓고 비교할 수 있게 했다.

     tokenizer -> vectorizer -> learner -> markov -> ingest -> skills -> brain

   브라우저라서 달라진 곳은 세 군데뿐이고, 각각 주석으로 표시해뒀다.
   ========================================================================== */


/* -------------------------------------------------------------- tokenizer */

const TOKEN_RE = /[가-힣]+|[a-zA-Z]+|[0-9]+/g;
const HANGUL_RE = /^[가-힣]+$/;

// 긴 것부터 지워야 "에서는"이 "는"으로 잘못 잘리지 않는다.
const SUFFIXES = [
  "으로써","으로서","이라고","에서는","에게서","한테서","으로","이라","라고",
  "에서","에게","한테","까지","부터","보다","처럼","마다","조차","밖에",
  "이랑","하고","이나","이야","께서","은","는","이","가","을","를",
  "의","에","와","과","도","만","로","야","랑","께",
  "습니까","습니다","였습니다","했습니다","이에요","예요","인가요","일까요",
  "했어요","하세요","해줘요","인가","일까","을까","ㄹ까","어요","아요",
  "네요","거야","건가","해요","해줘","해봐","하지","한다","했다","이다",
  "입니다","니다","는데","니야","나요","가요","군요","구나","잖아","거든",
  "더라","냐","지","죠","고","해","함","임","한","인","된","네","군","듯",
].sort((a, b) => b.length - a.length);

function normalizeText(text) {
  return (text || "").normalize("NFKC").replace(/\s+/g, " ").trim().toLowerCase();
}

function words(text) {
  return normalizeText(text).match(TOKEN_RE) || [];
}

function stem(word) {
  if (!HANGUL_RE.test(word) || word.length < 3) return word;
  for (const suffix of SUFFIXES) {
    if (word.endsWith(suffix) && word.length - suffix.length >= 2) {
      return word.slice(0, word.length - suffix.length);
    }
  }
  return word;
}

function bigrams(word) {
  if (!HANGUL_RE.test(word) || word.length < 2) return [];
  const out = [];
  for (let i = 0; i < word.length - 1; i++) out.push(word.slice(i, i + 2));
  return out;
}

// 원형 + 어간 + 음절 2-gram 을 모두 넣어야 활용형이 서로를 알아본다.
function features(text) {
  const out = [];
  for (const word of words(text)) {
    out.push(word);
    const root = stem(word);
    if (root !== word) out.push(root);
    out.push(...bigrams(word));
  }
  return out;
}

function counter(items) {
  const map = new Map();
  for (const item of items) map.set(item, (map.get(item) || 0) + 1);
  return map;
}


/* ------------------------------------------------------------- vectorizer */

// 커버리지 벌점의 세기. 라벨링한 문장으로 0 / 0.25 / 0.5 를 비교해서 고른 값이다.
const COVERAGE_EXPONENT = 0.25;

class TfidfIndex {
  constructor() {
    this.documents = [];
    this.payloads = [];
    this.docTerms = [];
    this.vectors = [];
    this.idf = new Map();
    this.defaultIdf = 1;
  }

  get size() { return this.documents.length; }

  add(text, payload) {
    this.documents.push(text);
    this.payloads.push(payload);
    this.docTerms.push(counter(features(text)));
  }

  build() {
    const total = this.docTerms.length;
    const df = new Map();
    for (const terms of this.docTerms) {
      for (const term of terms.keys()) df.set(term, (df.get(term) || 0) + 1);
    }
    this.idf = new Map();
    for (const [term, count] of df) {
      this.idf.set(term, Math.log((total + 1) / (count + 1)) + 1);
    }
    // 색인에 없는 단어는 "아주 드문 단어"로 취급한다. 그냥 버리면
    // 모르는 질문일수록 남은 흔한 단어끼리 100% 일치해버린다.
    this.defaultIdf = Math.log(total + 1) + 1;
    this.vectors = this.docTerms.map((terms) => this.toVector(terms));
  }

  toVector(terms) {
    if (!terms.size) return new Map();
    let maxCount = 0;
    for (const count of terms.values()) maxCount = Math.max(maxCount, count);

    const vector = new Map();
    for (const [term, count] of terms) {
      const idf = this.idf.has(term) ? this.idf.get(term) : this.defaultIdf;
      vector.set(term, (0.5 + (0.5 * count) / maxCount) * idf);
    }
    let norm = 0;
    for (const weight of vector.values()) norm += weight * weight;
    norm = Math.sqrt(norm);
    if (!norm) return new Map();
    for (const [term, weight] of vector) vector.set(term, weight / norm);
    return vector;
  }

  search(query, topK = 3) {
    if (!this.vectors.length) return [];
    const queryVector = this.toVector(counter(features(query)));
    if (!queryVector.size) return [];

    const scored = [];
    for (let i = 0; i < this.vectors.length; i++) {
      const vector = this.vectors[i];
      const [shorter, longer] =
        queryVector.size > vector.size ? [vector, queryVector] : [queryVector, vector];

      let cosine = 0;
      for (const [term, weight] of shorter) {
        const other = longer.get(term);
        if (other) cosine += weight * other;
      }
      if (cosine <= 0) continue;

      // 코사인만 쓰면 짧은 문서가 유리하다. 질의가 얼마나 설명됐는지를 함께 곱한다.
      let covered = 0;
      for (const [term, weight] of queryVector) {
        if (vector.has(term)) covered += weight * weight;
      }
      scored.push({
        score: cosine * Math.pow(covered, COVERAGE_EXPONENT),
        document: this.documents[i],
        payload: this.payloads[i],
      });
    }
    scored.sort((a, b) => b.score - a.score);
    return scored.slice(0, topK);
  }
}


/* ---------------------------------------------------------------- learner */

// questionForms() 가 사실 하나를 질문 네 개로 부풀릴 때 갖다 붙이는 의문사
// 껍데기들. 이건 내가 만든 문법이지 사용자가 준 정보가 아니므로, 분류기가
// 근거로 삼으면 안 된다. "뭐야" 하나만 겹쳤다고 답을 내놓으면 파일에 없는
// 질문까지 아무 답에나 붙어버린다.
const QUESTION_SCAFFOLD = new Set([
  ...features("뭐야"), ...features("알려줘"), ...features("에 대해 설명해줘"),
]);

class NaiveBayesClassifier {
  constructor(alpha = 0.3) {
    this.alpha = alpha;
    this.classCounts = new Map();
    this.tokenCounts = new Map();
    this.classTotals = new Map();
    this.vocabulary = new Set();
  }

  get classes() { return [...this.classCounts.keys()]; }

  get exampleCount() {
    let total = 0;
    for (const count of this.classCounts.values()) total += count;
    return total;
  }

  train(tokens, label) {
    tokens = tokens.filter(Boolean);
    if (!tokens.length) return;
    this.classCounts.set(label, (this.classCounts.get(label) || 0) + 1);
    if (!this.tokenCounts.has(label)) this.tokenCounts.set(label, new Map());
    const counts = this.tokenCounts.get(label);
    for (const token of tokens) {
      counts.set(token, (counts.get(token) || 0) + 1);
      this.vocabulary.add(token);
    }
    this.classTotals.set(label, (this.classTotals.get(label) || 0) + tokens.length);
  }

  // 어휘에 없는 토큰은 점수 계산에서 아예 빼고, 남은 것 중 의문사 껍데기가
  // 아닌 토큰이 하나도 없으면 판단을 포기한다.
  predict(tokens, minMargin = 0.08) {
    // 라벨이 하나뿐이면 정규화 확률이 무조건 1.0 이라 무엇을 물어도 그 답을
    // 내놓는다. 비교할 대상이 없으면 분류기는 침묵해야 한다.
    if (this.classCounts.size < 2) return null;

    const known = tokens.filter((token) => this.vocabulary.has(token));
    // "사는 곳이 뭐야" 처럼 내용어는 전부 처음 보고 "뭐야" 만 겹치는 경우를
    // 걸러낸다. 껍데기를 뺀 실질 근거가 없으면 아는 척하지 않는다.
    if (!known.some((token) => !QUESTION_SCAFFOLD.has(token))) return null;

    const totalDocs = this.exampleCount;
    const vocabularySize = this.vocabulary.size;
    const scores = [];
    for (const [label, count] of this.classCounts) {
      let score = Math.log(count / totalDocs);
      const denominator = this.classTotals.get(label) + this.alpha * vocabularySize;
      const counts = this.tokenCounts.get(label);
      for (const token of known) {
        score += Math.log(((counts.get(token) || 0) + this.alpha) / denominator);
      }
      scores.push([score, label]);
    }

    // log-sum-exp 로 정규화해서 확률처럼 읽을 수 있게 만든다.
    const best = Math.max(...scores.map((row) => row[0]));
    const exponentials = scores.map(([score, label]) => [Math.exp(score - best), label]);
    const total = exponentials.reduce((sum, row) => sum + row[0], 0);
    const probabilities = exponentials
      .map(([value, label]) => [value / total, label])
      .sort((a, b) => b[0] - a[0]);

    const [topProbability, topLabel] = probabilities[0];
    const runnerUp = probabilities.length > 1 ? probabilities[1][0] : 0;
    if (topProbability - runnerUp < minMargin) return null;
    return { label: topLabel, probability: topProbability };
  }
}


/* ----------------------------------------------------------------- markov */

const MARKOV_START = "\u0002";
const MARKOV_END = "\u0003";

class MarkovChain {
  constructor(order = 2) {
    this.order = order;
    this.table = new Map();
    this.trained = 0;
  }

  train(sentences) {
    for (const sentence of sentences) {
      const tokens = String(sentence).split(/\s+/).filter(Boolean);
      if (tokens.length < 2) continue;
      const padded = [...Array(this.order).fill(MARKOV_START), ...tokens, MARKOV_END];
      for (let i = 0; i < padded.length - this.order; i++) {
        const state = padded.slice(i, i + this.order);
        const next = padded[i + this.order];
        this.push(state.join(" "), next);
        // 낮은 차수 상태도 같이 저장해두면 막다른 길에서 빠져나올 수 있다.
        if (this.order > 1) this.push(state.slice(1).join(" "), next);
      }
      this.trained += 1;
    }
    return this;
  }

  push(key, value) {
    if (!this.table.has(key)) this.table.set(key, []);
    this.table.get(key).push(value);
  }

  next(state) {
    let choices = this.table.get(state.join(" "));
    if (!choices && state.length > 1) choices = this.table.get(state.slice(1).join(" "));
    if (!choices || !choices.length) return null;
    return choices[Math.floor(Math.random() * choices.length)];
  }

  generate(seed, maxWords = 24) {
    if (!this.table.size) return null;

    let state;
    let output;
    if (seed) {
      const seedTokens = String(seed).split(/\s+/).filter(Boolean).slice(-this.order);
      state = [...Array(this.order - seedTokens.length).fill(MARKOV_START), ...seedTokens];
      output = [...seedTokens];
      if (!this.table.has(state.join(" ")) && !this.table.has(state.slice(1).join(" "))) {
        state = Array(this.order).fill(MARKOV_START);
        output = [];
      }
    } else {
      state = Array(this.order).fill(MARKOV_START);
      output = [];
    }

    for (let i = 0; i < maxWords; i++) {
      const token = this.next(state);
      if (token === null || token === MARKOV_END) break;
      output.push(token);
      state = [...state.slice(1), token];
    }
    const sentence = output
      .filter((t) => t !== MARKOV_START && t !== MARKOV_END)
      .join(" ")
      .trim();
    return sentence || null;
  }
}


/* ----------------------------------------------------------------- ingest */

const QUESTION_LINE = /^\s*(?:q|질문|물음)\s*[:：.]\s*(.+)$/i;
const ANSWER_LINE = /^\s*(?:a|답|답변)\s*[:：.]\s*(.+)$/i;
const KEY_VALUE = /^\s*([^:：|]{1,30}?)\s*[:：]\s*(.+?)\s*$/;
// 서술문("오늘은 날씨가 좋았다")까지 사실로 삼지 않으려고 서술격 조사를
// 필수로 요구하고, 주어는 두 어절까지만 허용한다.
const DEFINITION =
  /^\s*(\S+(?:\s\S+)?)\s*(?:은|는|이란|란)\s+(.+?)\s*(?:이다|이야|입니다|이에요|예요|라고\s*해)\s*[.!]?\s*$/;
const QUESTION_MARK = /[?？]\s*$/;

// 마지막 글자에 받침이 있는지. 조사를 자연스럽게 고르는 데 쓴다.
function hasBatchim(word) {
  if (!word) return false;
  const last = word.trim().slice(-1);
  if (!(last >= "가" && last <= "힣")) return false;
  return (last.charCodeAt(0) - 0xac00) % 28 !== 0;
}

function questionForms(subject) {
  subject = subject.trim();
  const marker = hasBatchim(subject) ? "이" : "가";
  return [
    subject + " 뭐야",
    subject + marker + " 뭐야",
    subject + " 알려줘",
    subject + "에 대해 설명해줘",
  ];
}

function parseSource(rawText) {
  const facts = new Map();
  const pairs = [];
  const sentences = [];
  const seenQuestions = new Set();

  function addPair(question, answer, origin) {
    question = question.trim();
    answer = answer.trim();
    if (!question || !answer) return;
    const key = question.toLowerCase();
    if (seenQuestions.has(key)) return;
    seenQuestions.add(key);
    pairs.push({ question, answer, origin });
  }

  let pendingQuestion = null;
  for (const rawLine of String(rawText || "").split(/\r?\n/)) {
    const line = rawLine.trim();
    if (!line || line.startsWith("#")) continue;

    let match = line.match(QUESTION_LINE);
    if (match) { pendingQuestion = match[1].trim(); continue; }

    match = line.match(ANSWER_LINE);
    if (match && pendingQuestion) {
      addPair(pendingQuestion, match[1], "qa");
      pendingQuestion = null;
      continue;
    }

    // 질문만 덩그러니 있고 다음 줄이 답인 경우
    if (pendingQuestion) {
      addPair(pendingQuestion, line, "qa");
      pendingQuestion = null;
      continue;
    }

    if (line.includes("|")) {
      const at = line.indexOf("|");
      const question = line.slice(0, at);
      const answer = line.slice(at + 1);
      if (question.trim() && answer.trim()) { addPair(question, answer, "pipe"); continue; }
    }

    if (QUESTION_MARK.test(line)) { pendingQuestion = line; continue; }

    // 콜론은 가장 명시적인 표기이므로 정의문보다 먼저 해석한다.
    match = line.match(KEY_VALUE);
    if (match) {
      const key = match[1].trim();
      const value = match[2].trim();
      facts.set(key, value);
      for (const form of questionForms(key)) addPair(form, value, "fact");
      continue;
    }

    match = line.match(DEFINITION);
    if (match) {
      const subject = match[1].trim();
      const description = match[2].trim();
      if (subject && description.length >= 2) {
        facts.set(subject, description);
        for (const form of questionForms(subject)) addPair(form, line, "definition");
        sentences.push(line);
        continue;
      }
    }

    sentences.push(line);
  }

  if (pendingQuestion) sentences.push(pendingQuestion);  // 답 없는 질문은 문장으로만
  return { facts, pairs, sentences };
}

// 원본을 데이터셋으로 컴파일한다. 호출할 때마다 처음부터 다시 만들기 때문에,
// 원본에서 지운 내용은 데이터셋에서도 사라진다 - 파일이 곧 유일한 진실이다.
function compileSource(rawText) {
  const stripped = String(rawText || "").replace(/^\s+/, "");
  if (!stripped.startsWith("{")) return parseSource(rawText);

  let loaded;
  try {
    loaded = JSON.parse(rawText);
  } catch (error) {
    throw new Error("JSON 형식이 잘못됐어: " + error.message);
  }
  const facts = new Map(Object.entries(loaded.facts || {}));
  const pairs = (loaded.pairs || [])
    .filter((item) => item && item.question && item.answer)
    .map((item) => ({ ...item }));
  const seen = new Set(pairs.map((item) => item.question.toLowerCase()));
  for (const [key, value] of facts) {
    for (const form of questionForms(key)) {
      if (!seen.has(form.toLowerCase())) {
        seen.add(form.toLowerCase());
        pairs.push({ question: form, answer: value, origin: "fact" });
      }
    }
  }
  const sentences = (loaded.sentences || []).filter((s) => typeof s === "string");
  return { facts, pairs, sentences };
}

function emptyDataset() {
  return { facts: new Map(), pairs: [], sentences: [] };
}

/* 브라우저에서 달라진 곳 (1/3): 파이썬판은 ast 모듈로 식을 검사했지만 JS 에는
   그런 게 없다. eval() 은 파이썬판에서 일부러 피한 것이라 여기서도 쓰지 않고,
   재귀 하강 파서를 직접 짰다. 사칙연산·거듭제곱·단항 부호·괄호만 인식하고
   그 밖의 문자는 토큰화 단계에서 거부되므로 임의 코드가 실행될 여지가 없다. */
function safeEval(expression) {
  const source = String(expression).replace(/\s+/g, "");
  const tokens = source.match(/\d+\.?\d*|\*\*|[+\-*/%()]/g);
  if (!tokens) throw new Error("빈 식");
  // 토큰을 도로 이어붙여 원문과 같은지 확인한다. 다르면 인식 못 한 문자가 있다는 뜻.
  if (tokens.join("") !== source) throw new Error("허용되지 않은 문자");

  let position = 0;
  const peek = () => tokens[position];
  const take = () => tokens[position++];

  function parseExpression() {          // + -
    let value = parseTerm();
    while (peek() === "+" || peek() === "-") {
      value = take() === "+" ? value + parseTerm() : value - parseTerm();
    }
    return value;
  }
  function parseTerm() {                // * / %
    let value = parseUnary();
    while (peek() === "*" || peek() === "/" || peek() === "%") {
      const operator = take();
      const right = parseUnary();
      if ((operator === "/" || operator === "%") && right === 0) throw new RangeError("0으로 나눔");
      if (operator === "*") value *= right;
      else if (operator === "/") value /= right;
      else value %= right;
    }
    return value;
  }
  function parseUnary() {               // 단항 + -
    if (peek() === "-") { take(); return -parseUnary(); }
    if (peek() === "+") { take(); return parseUnary(); }
    return parsePower();
  }
  function parsePower() {               // ** (오른쪽 결합)
    const base = parseAtom();
    if (peek() === "**") { take(); return Math.pow(base, parseUnary()); }
    return base;
  }
  function parseAtom() {
    const token = take();
    if (token === "(") {
      const value = parseExpression();
      if (take() !== ")") throw new Error("괄호가 안 닫힘");
      return value;
    }
    if (token === undefined || !/^\d/.test(token)) throw new Error("숫자가 아님");
    return parseFloat(token);
  }

  const result = parseExpression();
  if (position !== tokens.length) throw new Error("남은 토큰");
  if (!Number.isFinite(result)) throw new RangeError("계산 불가");
  return Math.abs(result - Math.round(result)) < 1e-12
    ? Math.round(result)
    : Number(result.toFixed(10));
}

const KOREAN_OPS = [
  ["더하기", "+"], ["빼기", "-"], ["곱하기", "*"], ["나누기", "/"],
  ["플러스", "+"], ["마이너스", "-"], ["나머지", "%"], ["제곱", "**"],
];

function calculator(text) {
  let expression = normalizeText(text);
  for (const [korean, symbol] of KOREAN_OPS) expression = expression.split(korean).join(symbol);
  expression = expression.replace(/\^/g, "**").replace(/×/g, "*").replace(/÷/g, "/");
  expression = expression
    .replace(/(는|은)?\s*(뭐야|몇이야|얼마야|계산해줘|계산해|얼마|몇)\s*[?？]?$/, "")
    .trim();

  if (!expression) return null;
  if (!/^[\d\s+\-*/().%]+$/.test(expression.split("**").join(""))) return null;
  if (!/[+\-*/%]/.test(expression) || !/\d/.test(expression)) return null;

  try {
    return expression + " = " + safeEval(expression);
  } catch (error) {
    if (error instanceof RangeError) return "0으로는 못 나눠. 그건 나도 안 돼.";
    return null;
  }
}

const WEEKDAYS = ["일", "월", "화", "수", "목", "금", "토"];

function clock(text) {
  const query = normalizeText(text);
  const now = new Date();
  // "출근 몇시에 해" 같은 질문까지 현재 시각으로 답하지 않도록,
  // 지금 시각을 묻는 문장 전체와 일치할 때만 반응한다.
  if (/^(지금|현재)?\s*(몇\s*시|시간)\s*(야|지|인가요?|예요|입니까|알려줘|알려|됐어)?\s*[?？]?$/.test(query)) {
    const hh = String(now.getHours()).padStart(2, "0");
    const mm = String(now.getMinutes()).padStart(2, "0");
    return "지금 " + hh + "시 " + mm + "분이야.";
  }
  if (/(며칠|몇\s*일|무슨\s*요일|요일이야|날짜)/.test(query)) {
    return "오늘은 " + now.getFullYear() + "년 " + (now.getMonth() + 1) + "월 "
      + now.getDate() + "일 " + WEEKDAYS[now.getDay()] + "요일이야.";
  }
  return null;
}

function dice(text) {
  const query = normalizeText(text);
  if (query.includes("동전") && /(던져|뒤집|튕겨)/.test(query)) {
    return "결과는 " + (Math.random() < 0.5 ? "앞면" : "뒷면") + "!";
  }
  if (query.includes("주사위")) {
    return "주사위 굴린 결과: " + (1 + Math.floor(Math.random() * 6));
  }
  const match = query.match(/(\d+)\s*(?:부터|~|-)\s*(\d+)\s*(?:사이|중).*(?:랜덤|아무|뽑아|골라)/);
  if (match) {
    const low = Math.min(+match[1], +match[2]);
    const high = Math.max(+match[1], +match[2]);
    return "내가 고른 숫자는 " + (low + Math.floor(Math.random() * (high - low + 1))) + "!";
  }
  return null;
}

function coinChoice(text) {
  const query = normalizeText(text);
  if (!/(중에|중에서)/.test(query) || !/(뭐|어느|어떤|골라|추천)/.test(query)) return null;
  const head = query.split(/중에서|중에/)[0];
  const options = head
    .split(/랑|이랑|하고|,|와|과/)
    .map((option) => option.trim())
    .filter((option) => option.length > 0 && option.length <= 20);
  if (options.length < 2) return null;
  return "고민되면 " + options[Math.floor(Math.random() * options.length)] + " 쪽에 한 표.";
}

// 파일에 적힌 사실은 답해주되, 대화로 새 정보를 받지는 않는다 (읽기 전용).
function factLookup(text, brain) {
  const query = normalizeText(text);
  const match = query.match(/내\s*([가-힣a-zA-Z ]{1,15}?)\s*(?:이|가)?\s*뭐(?:야|였지|지)/);
  if (match) {
    const key = match[1].trim();
    const value = brain.dataset.facts.get(key);
    if (value) return key + "은(는) " + value + "(이)야.";
  }
  if (/(내\s*이름은|나는\s*[가-힣]{1,10}(야|이야))/.test(query)) {
    return "대화로는 정보를 안 받게 돼 있어. 원본 파일에 적어주면 학습할게.";
  }
  return null;
}

const ALL_SKILLS = [
  ["factLookup", factLookup],
  ["calculator", (text) => calculator(text)],
  ["clock", (text) => clock(text)],
  ["dice", (text) => dice(text)],
  ["coinChoice", (text) => coinChoice(text)],
];


/* ------------------------------------------------------------------ brain */

// 이 아래면 "모르겠다", 이 위면 확신, 사이면 되묻는다.
const CONFIDENT = 0.30;
const UNSURE = 0.13;
// 검색이 애매할 때 분류기 단독으로 답하려면 이만큼은 확신해야 한다.
const BAYES_CONFIDENT = 0.80;

const YES = /^(응+|어+|웅|ㅇ+|네|넹|예|맞아요?|맞어|그래|그렇지|정답|yes|y|ok)[.!~]*$/;
const NO = /^(아니+(야|요)?|아냐|ㄴ+|노|틀렸어|틀려|아닌데|no|n)[.!~]*$/;

class Brain {
  constructor() {
    this.dataset = emptyDataset();
    this.sourceName = null;
    this.index = new TfidfIndex();
    this.classifier = new NaiveBayesClassifier();
    this.markov = new MarkovChain(2);
    this.labelAnswers = new Map();
    this.pendingConfirm = null;
    this.stats = { turns: 0, matched: 0, unknown: 0 };
    this.reindex();
  }

  /* 원본을 다시 읽어 데이터셋과 색인을 통째로 갱신한다. */
  loadSource(rawText, sourceName) {
    this.dataset = compileSource(rawText);      // 여기서 던지면 이전 상태가 유지된다
    this.sourceName = sourceName || this.sourceName;
    this.reindex();
    return {
      facts: this.dataset.facts.size,
      pairs: this.dataset.pairs.length,
      sentences: this.dataset.sentences.length,
    };
  }

  reindex() {
    this.index = new TfidfIndex();
    this.classifier = new NaiveBayesClassifier();
    this.markov = new MarkovChain(2);
    this.labelAnswers = new Map();
    const corpus = [];

    // 같은 답을 가리키는 질문들을 한 라벨로 묶어 분류기에 먹인다.
    // "수도 뭐야 / 수도가 뭐야 / 수도 알려줘" 가 한 묶음이 되므로,
    // 파일에 없는 표현으로 물어도 같은 답에 닿을 수 있다.
    const answerLabels = new Map();
    this.dataset.pairs.forEach((item, position) => {
      this.index.add(item.question, position);
      let label = answerLabels.get(item.answer);
      if (label === undefined) {
        label = "answer:" + answerLabels.size;
        answerLabels.set(item.answer, label);
        this.labelAnswers.set(label, item.answer);
      }
      this.classifier.train(features(item.question), label);
      corpus.push(item.question, item.answer);
    });
    corpus.push(...this.dataset.sentences);

    this.index.build();
    this.markov.train(corpus);
  }

  respond(text) {
    text = (text || "").trim();
    if (!text) return { text: "뭐라고? 아무것도 안 들렸어.", source: "empty", score: 0 };

    if (this.pendingConfirm) {
      const reply = this.handleConfirmation(text);
      if (reply) return reply;
    }

    this.stats.turns += 1;

    // 내가 준 데이터가 내장 스킬보다 우선한다. 파일에 "출근 시간"을 적어놨는데
    // "출근 몇시에 해" 가 시계 스킬로 새면 안 되기 때문이다.
    const results = this.index.search(text, 3);
    const top = results.length ? results[0] : null;

    if (top && top.score >= CONFIDENT) {
      this.stats.matched += 1;
      return {
        text: this.dataset.pairs[top.payload].answer,
        source: "match:" + top.document,
        score: top.score,
      };
    }

    for (const [name, skill] of ALL_SKILLS) {
      const answer = skill(text, this);
      if (answer) {
        this.stats.matched += 1;
        return { text: answer, source: "skill:" + name, score: 1 };
      }
    }

    // 검색이 흔들릴 때 분류기에게 물어본다.
    const prediction = this.classifier.predict(features(text));
    if (prediction && prediction.probability >= BAYES_CONFIDENT) {
      const answer = this.labelAnswers.get(prediction.label);
      if (answer) {
        this.stats.matched += 1;
        return { text: answer, source: "bayes:" + prediction.label, score: prediction.probability };
      }
    }

    if (top && top.score >= UNSURE) {
      this.pendingConfirm = top.payload;
      return {
        text: "혹시 '" + top.document + "' 얘기야? 맞으면 '응' 이라고 해줘.",
        source: "clarify:" + top.document,
        score: top.score,
      };
    }

    this.stats.unknown += 1;
    if (!this.dataset.pairs.length) {
      return {
        text: "아직 배운 게 없어. 옆의 source.txt 에 적고 '새로고침' 을 눌러줘.\n'작성법' 버튼을 누르면 적는 방법을 보여줄게.",
        source: "fallback",
        score: 0,
      };
    }
    const preview = text.length <= 20 ? text : text.slice(0, 20) + "...";
    return {
      text: "'" + preview + "' 은(는) 내 파일에 없는 내용이야.\nsource.txt 에 적고 '새로고침' 을 눌러줘.",
      source: "fallback",
      score: 0,
    };
  }

  // 되묻기는 하되, 그 대답으로 지식을 늘리지는 않는다 (대화 학습 금지).
  handleConfirmation(text) {
    const stripped = normalizeText(text);
    const position = this.pendingConfirm;

    if (NO.test(stripped)) {
      this.pendingConfirm = null;
      return { text: "아, 아니구나. 그럼 원본 파일에 적어줘.", source: "confirm:no", score: 0 };
    }
    if (!YES.test(stripped)) {
      this.pendingConfirm = null;
      return null;                    // 확인이 아니라 새 이야기다
    }
    this.pendingConfirm = null;
    return { text: this.dataset.pairs[position].answer, source: "confirm:yes", score: 1 };
  }

  imagine(seed) {
    for (let i = 0; i < 6; i++) {
      const sentence = this.markov.generate(seed || null);
      if (sentence && sentence !== seed) return sentence;
    }
    return "아직 배운 문장이 부족해서 상상이 안 돼.";
  }

  explain(text) {
    const rows = this.index.search(text, 5);
    const lines = [];
    if (rows.length) {
      lines.push("[유사도 검색]");
      for (const row of rows) {
        lines.push("  " + row.score.toFixed(3) + "  " + row.document);
      }
    } else {
      lines.push("[유사도 검색] 후보 없음");
    }
    const prediction = this.classifier.predict(features(text));
    lines.push("[분류기] " + (prediction
      ? this.labelAnswers.get(prediction.label) + " (" + Math.round(prediction.probability * 100) + "%)"
      : "판단 보류 (근거 부족)"));
    lines.push("[토큰] " + (features(text).join(", ") || "없음"));
    return lines.join("\n");
  }

  dataSummary() {
    const { facts, pairs, sentences } = this.dataset;
    if (!facts.size && !pairs.length && !sentences.length) {
      return "데이터셋이 비어 있어. 파일을 열거나 창에 끌어다 놓아줘.";
    }
    const lines = ["원본: " + (this.sourceName || "없음")];
    if (facts.size) {
      lines.push("[사실 " + facts.size + "개]");
      for (const [key, value] of facts) lines.push("  " + key + " = " + value);
    }
    if (pairs.length) {
      lines.push("[문답 " + pairs.length + "개]");
      for (const item of pairs.slice(0, 24)) {
        lines.push("  " + item.question + " -> " + item.answer);
      }
      if (pairs.length > 24) lines.push("  ... 외 " + (pairs.length - 24) + "개");
    }
    if (sentences.length) lines.push("[문장 " + sentences.length + "개]");
    return lines.join("\n");
  }

  progress() {
    const turns = Math.max(this.stats.turns, 1);
    return [
      "[대화] 총 " + this.stats.turns + "턴 · 응답 " + this.stats.matched
        + "회 · 모름 " + this.stats.unknown + "회 · 응답률 "
        + Math.round((this.stats.matched / turns) * 100) + "%",
      "[출처] 내가 준 파일만 · 대화 학습 꺼짐",
      "[원본] " + (this.sourceName || "없음"),
      "[데이터셋] 사실 " + this.dataset.facts.size + "개 · 문답 "
        + this.dataset.pairs.length + "개 · 문장 " + this.dataset.sentences.length + "개",
      "[분류기] 라벨 " + this.classifier.classes.length + "개 · 예문 "
        + this.classifier.exampleCount + "개 · 어휘 " + this.classifier.vocabulary.size + "개",
      "[생성기] 학습 문장 " + this.markov.trained + "개",
    ].join("\n");
  }
}

/* 브라우저에서 달라진 곳 (2/3): 파이썬판은 dataset.json 을 디스크에 썼지만
   여기서는 localStorage 에 넣는다. 사생활 보호 모드나 파일 프로토콜에서는
   접근 자체가 예외를 던질 수 있으므로 읽기·쓰기를 모두 try 로 감싼다. */
const STORAGE_KEY = "mini_ai.dataset.v1";

function saveToStorage(brain) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      sourceName: brain.sourceName,
      facts: Object.fromEntries(brain.dataset.facts),
      pairs: brain.dataset.pairs,
      sentences: brain.dataset.sentences,
    }));
    return true;
  } catch (error) {
    return false;
  }
}

function loadFromStorage(brain) {
  let stored;
  try {
    stored = localStorage.getItem(STORAGE_KEY);
  } catch (error) {
    return false;
  }
  if (!stored) return false;
  try {
    const parsed = JSON.parse(stored);
    brain.dataset = {
      facts: new Map(Object.entries(parsed.facts || {})),
      pairs: (parsed.pairs || []).filter((item) => item && item.question && item.answer),
      sentences: (parsed.sentences || []).filter((s) => typeof s === "string"),
    };
    brain.sourceName = parsed.sourceName || null;
    brain.reindex();
    return brain.dataset.pairs.length > 0;
  } catch (error) {
    return false;
  }
}

function clearStorage() {
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (error) {
    /* 지울 수 없어도 화면 상태는 초기화된다 */
  }
}

  "",
  "  # 이렇게 시작하는 줄은 주석",
  "  좋아하는 음식: 마라탕          <- 키: 값  (사실)",
  "  회사 출근 시간: 오전 9시 30분",
  "",
  "  Q: 우리 강아지 이름이 뭐야     <- 명시적 문답",
  "  A: 콩이야",
  "",
  "  주말에 뭐 할까 | 한강 가자     <- 한 줄 문답",
  "",
  "  파이썬은 배우기 쉬운 언어이다   <- X는 Y이다 (사실 + 자동 문답)",
  "",
  "  오늘은 비가 왔다               <- 그 외 문장은 말투 학습용",
  "",
  '이미 정리된 JSON 을 그대로 넣어도 된다 ({"facts": {...}, "pairs": [...]}).',
  "원본이 유일한 진실이라, 파일에서 지운 내용은 다음 새로고침에 사라진다.",
  "",
  "더블클릭으로 열었다면 브라우저가 옆 파일을 못 읽으니, 그 파일을 창에",
  "끌어다 놓거나 이 폴더에서 'python3 -m http.server 8000' 으로 열어줘.",
].join("\n");

const HELP = [
  "명령어",
  "  /새로고침    옆의 source.txt 를 다시 읽어서 학습",
  "  /데이터      지금 학습한 내용 전부 보기",
  "  /작성법      source.txt 적는 방법",
  "  /학습현황    무엇을 얼마나 배웠는지 통계",
  "  /상상 [단어] 배운 문장들로 새 문장 지어내기",
  "  /디버그 문장 유사도 후보와 분류기 판단 보기",
  "  /지우기      저장된 데이터 전부 삭제",
  "",
  "위쪽 버튼으로도 전부 할 수 있어. 다른 파일을 창에 끌어다 놓으면",
  "그 파일이 대신 원본이 된다.",
].join("\n");

function addTurn(who, text, options) {
  options = options || {};
  const turn = document.createElement("div");
  turn.className = "turn " + (who === "나" ? "me" : "bot");

  const label = document.createElement("div");
  label.className = "who";
  label.textContent = who;
  turn.appendChild(label);

  const bubble = document.createElement("div");
  bubble.className = "bubble" + (options.mono ? " mono" : "") + (options.system ? " system" : "");
  bubble.textContent = text;            // textContent 라서 입력이 HTML 로 해석되지 않는다
  turn.appendChild(bubble);

  if (options.score) {
    const score = document.createElement("div");
    score.className = "score";
    score.textContent = options.score;
    turn.appendChild(score);
  }

  log.appendChild(turn);
  log.scrollTop = log.scrollHeight;
}

/* 페이지 옆에 있는 정보 파일. 이게 기본 원본이다. */
const SOURCE_FILE = "source.txt";

/* 옆 파일을 읽어온다. 실패하면 왜 실패했는지까지 같이 돌려준다.

   file:// 로 열면 브라우저가 같은 폴더의 파일도 다른 출처로 보고 막는다.
   이건 고칠 수 있는 버그가 아니라 정책이라, 그럴 땐 이유를 정확히 알려주고
   드래그앤드롭으로 넘긴다. */
async function fetchSiblingSource() {
  if (location.protocol === "file:") {
    return { text: null, reason: "file" };
  }
  try {
    // 고친 파일을 확실히 다시 읽으려고 캐시를 끈다.
    const response = await fetch(SOURCE_FILE + "?t=" + Date.now(), { cache: "no-store" });
    if (!response.ok) return { text: null, reason: "missing" };
    return { text: await response.text(), reason: null };
  } catch (error) {
    return { text: null, reason: "blocked" };
  }
}

function refreshStatus() {
  const { facts, pairs, sentences } = brain.dataset;
  if (!pairs.length) {
    statusLine.textContent = "원본 없음 — source.txt 에 적거나 파일을 끌어다 놓아줘.";
    return;
  }
  statusLine.innerHTML = "";
  const name = document.createElement("b");
  name.textContent = brain.sourceName || "저장된 데이터";
  statusLine.appendChild(name);
  statusLine.appendChild(document.createTextNode(
    "  ·  사실 " + facts.size + "  ·  문답 " + pairs.length + "  ·  문장 " + sentences.length
  ));
}

function applySource(rawText, sourceName, quiet) {
  let counts;
  try {
    counts = brain.loadSource(rawText, sourceName);
  } catch (error) {
    addTurn("미니", "원본을 못 읽었어: " + error.message, { system: true });
    return null;
  }
  const saved = saveToStorage(brain);
  refreshStatus();
  if (!quiet) {
    addTurn("미니",
      "다시 학습했어. 사실 " + counts.facts + "개 · 문답 " + counts.pairs
        + "개 · 문장 " + counts.sentences + "개"
        + (saved ? "" : "\n(브라우저 저장소를 못 써서 이번 세션에만 기억해.)"),
      { system: true });
  }
  return counts;
}

/* 브라우저에서 달라진 곳 (3/3): 브라우저는 파일 시스템을 뒤질 수 없다.
   File System Access API 가 있으면 파일 핸들을 붙잡아 뒀다가 '새로고침' 에서
   같은 파일을 다시 읽고, 없으면 파일을 다시 선택하게 안내한다. */
async function openFile() {
  if (window.showOpenFilePicker) {
    try {
      const [handle] = await window.showOpenFilePicker({
        types: [{
          description: "학습할 원본",
          accept: { "text/plain": [".txt", ".md"], "application/json": [".json"] },
        }],
      });
      fileHandle = handle;
      const file = await handle.getFile();
      applySource(await file.text(), file.name);
      return;
    } catch (error) {
      if (error && error.name === "AbortError") return;   // 사용자가 취소함
      fileHandle = null;                                   // 권한 문제면 입력창으로 대체
    }
  }
  picker.click();
}

async function reloadFile() {
  // 옆 파일에서 온 원본이면 그냥 다시 읽으면 된다. 이 경우가 제일 편하다.
  if (brain.sourceName === SOURCE_FILE) {
    const { text, reason } = await fetchSiblingSource();
    if (text !== null) {
      applySource(text, SOURCE_FILE);
      return;
    }
    addTurn("미니", explainFetchFailure(reason), { system: true });
    return;
  }

  if (fileHandle) {
    try {
      const file = await fileHandle.getFile();
      applySource(await file.text(), file.name);
      return;
    } catch (error) {
      fileHandle = null;
    }
  }
  addTurn("미니",
    "브라우저는 파일 변경을 지켜볼 수 없어서, 고친 파일을 다시 열어야 해.\n"
      + "'파일 열기' 를 누르거나 창에 다시 끌어다 놔줘.",
    { system: true });
}

/* 옆 파일을 못 읽은 이유를 사람 말로 옮긴다. */
function explainFetchFailure(reason) {
  if (reason === "missing") {
    return "옆에 " + SOURCE_FILE + " 이 없어. 그 파일을 만들어서 정보를 적거나,\n"
      + "다른 파일을 창에 끌어다 놔줘.";
  }
  if (reason === "file") {
    return "지금은 파일을 더블클릭해서 연 상태라, 브라우저가 옆에 있는 "
      + SOURCE_FILE + " 을\n읽는 걸 막고 있어 (보안 정책이라 내가 못 뚫어).\n\n"
      + "둘 중 하나면 돼:\n"
      + "  1) " + SOURCE_FILE + " 을 이 창에 끌어다 놓기\n"
      + "  2) 이 폴더에서 서버를 띄우고 그 주소로 열기\n"
      + "     python3 -m http.server 8000\n"
      + "     http://localhost:8000/web/\n"
      + "     이렇게 열면 파일 고치고 '새로고침' 만 누르면 바로 반영돼.";
  }
  return "옆 파일을 읽지 못했어. 창에 직접 끌어다 놔줘.";
}

function readDroppedFile(file) {
  const reader = new FileReader();
  reader.onload = () => applySource(String(reader.result), file.name);
  reader.onerror = () => addTurn("미니", "파일을 읽다가 실패했어.", { system: true });
  reader.readAsText(file, "utf-8");
}

function handleCommand(line) {
  const [name, ...rest] = line.slice(1).split(" ");
  const argument = rest.join(" ").trim();
  switch (name.toLowerCase()) {
    case "도움말": case "help": return { text: HELP, mono: true };
    case "작성법": case "원본": case "guide": return { text: GUIDE, mono: true };
    case "데이터": case "data": return { text: brain.dataSummary(), mono: true };
    case "학습현황": case "stats": return { text: brain.progress(), mono: true };
    case "상상": case "dream": return { text: brain.imagine(argument || null) };
    case "디버그": case "debug":
      return argument
        ? { text: brain.explain(argument), mono: true }
        : { text: "'/디버그 안녕' 처럼 확인할 문장을 같이 적어줘." };
    case "새로고침": case "reload": reloadFile(); return null;
    case "지우기": case "clear":
      clearStorage();
      brain.dataset = emptyDataset();
      brain.sourceName = null;
      brain.stats = { turns: 0, matched: 0, unknown: 0 };
      brain.reindex();
      refreshStatus();
      return { text: "저장된 데이터를 전부 지웠어.", system: true };
    default: return { text: "그런 명령은 없어. '/도움말' 을 봐." };
  }
}

function submit(rawLine) {
  const line = rawLine.trim();
  if (!line) return;
  addTurn("나", line);

  if (line.startsWith("/")) {
    const result = handleCommand(line);
    if (result) addTurn("미니", result.text, result);
    return;
  }

  const reply = brain.respond(line);
  addTurn("미니", reply.text, {
    score: showScore ? reply.source + "  " + reply.score.toFixed(2) : null,
  });
}

/* ------------------------------------------------------------------ 이벤트 */

document.getElementById("composer").addEventListener("submit", (event) => {
  event.preventDefault();
  submit(entry.value);
  entry.value = "";
  entry.style.height = "auto";
  entry.focus();
});

entry.addEventListener("input", () => {
  entry.style.height = "auto";
  entry.style.height = Math.min(entry.scrollHeight, 140) + "px";
});

entry.addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    document.getElementById("composer").requestSubmit();
  }
});

document.getElementById("btn-open").addEventListener("click", openFile);
document.getElementById("btn-reload").addEventListener("click", reloadFile);
document.getElementById("btn-data").addEventListener("click", () => submit("/데이터"));
document.getElementById("btn-stats").addEventListener("click", () => submit("/학습현황"));
document.getElementById("btn-guide").addEventListener("click", () => submit("/작성법"));
document.getElementById("btn-dream").addEventListener("click", () => submit("/상상"));
document.getElementById("btn-clear").addEventListener("click", () => submit("/지우기"));

scoreButton.addEventListener("click", () => {
  showScore = !showScore;
  scoreButton.setAttribute("aria-pressed", String(showScore));
});

picker.addEventListener("change", () => {
  if (picker.files && picker.files[0]) readDroppedFile(picker.files[0]);
  picker.value = "";
});

let dragDepth = 0;
window.addEventListener("dragenter", (event) => {
  event.preventDefault();
  dragDepth += 1;
  document.body.classList.add("dragging");
});
window.addEventListener("dragover", (event) => event.preventDefault());
window.addEventListener("dragleave", () => {
  dragDepth = Math.max(0, dragDepth - 1);
  if (!dragDepth) document.body.classList.remove("dragging");
});
window.addEventListener("drop", (event) => {
  event.preventDefault();
  dragDepth = 0;
  document.body.classList.remove("dragging");
  const file = event.dataTransfer && event.dataTransfer.files && event.dataTransfer.files[0];
  if (file) readDroppedFile(file);
});

/* ------------------------------------------------------------------ 시작 */

/* 우선순위:
     1. 옆에 있는 source.txt   - 읽을 수 있으면 이게 항상 기준이다
     2. 저장해둔 데이터        - 지난번에 떨어뜨린 파일
     3. 안내                   - 아무것도 없을 때

   1번이 2번을 덮어쓰는 게 맞다. 파일이 유일한 진실이어야 하는데,
   지난번 데이터가 남아서 고친 파일을 가리면 그 원칙이 깨진다. */
async function start() {
  const { text, reason } = await fetchSiblingSource();

  if (text !== null) {
    const counts = applySource(text, SOURCE_FILE, true);
    if (counts && counts.pairs) {
      addTurn("미니",
        SOURCE_FILE + " 읽었어. 사실 " + counts.facts + "개 · 문답 " + counts.pairs
          + "개 · 문장 " + counts.sentences + "개\n"
          + "그 파일 고치고 '새로고침' 누르면 바로 반영돼. 물어봐.",
        { system: true });
      entry.focus();
      return;
    }
    addTurn("미니",
      SOURCE_FILE + " 은 찾았는데 아직 내용이 비어 있어.\n"
        + "그 파일을 열어서 정보를 적고 '새로고침' 을 눌러줘.\n"
        + "적는 방법은 '작성법' 버튼에 있어.",
      { system: true });
    entry.focus();
    return;
  }

  if (loadFromStorage(brain)) {
    refreshStatus();
    addTurn("미니",
      "저장해둔 데이터를 불러왔어. (" + (brain.sourceName || "이름 없음") + ")\n"
        + "파일을 고쳤으면 다시 끌어다 놔줘. 뭐든 물어봐.",
      { system: true });
    entry.focus();
    return;
  }

  refreshStatus();
  addTurn("미니",
    "안녕. 나는 네가 준 파일에 있는 내용만 대답해.\n" + explainFetchFailure(reason),
    { system: true });
  entry.focus();
}

start();
</script>
